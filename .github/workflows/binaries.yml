# Builds drawtool for each platform the Claude Code plugin supports and puts
# the binaries on a new release for the crate's version (v<version> from
# Cargo.toml), marked latest, with their SHA256SUMS; plugin/bin/drawtool
# downloads from it and checks the binary against them.
# A version that already has a release is left as it is: bump the version
# to release.
name: binaries

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/binaries.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Ondine needs Rust 1.97 or later.
      - run: rustup update stable --no-self-update
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/drawtool drawtool-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: drawtool-${{ matrix.target }}
          path: drawtool-${{ matrix.target }}

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release the version, unless it already has a release
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; bump the version in Cargo.toml to release this build"
            exit 0
          fi
          (cd dist && sha256sum drawtool-* > SHA256SUMS)
          notes="drawtool built from $GITHUB_SHA by CI. The Claude Code plugin downloads these; to build it yourself: cargo install --git https://github.com/$GH_REPO"
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "$tag" --notes "$notes" --latest
