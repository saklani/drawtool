[package]
name = "drawtool"
version = "0.1.0"
edition = "2021"
description = "Render Mermaid-style flowcharts as box diagrams in the terminal"
license = "MIT"

[dependencies]
compiler = { git = "https://github.com/wevm/ondine", rev = "7c00ceaf942dd67514d1f8dd58a8550e444f7047", default-features = false, features = ["flowchart", "sequence", "state", "model"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
petgraph = { version = "0.8", default-features = false, features = ["std"] }
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
terminal_size = "0.4"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
# Layout arithmetic should never overflow; if it does, fail loudly instead of
# wrapping into a huge coordinate and hanging.
overflow-checks = true
lto = true
strip = true

[lints.clippy]
must_use_candidate = "warn"
missing_errors_doc = "warn"
needless_pass_by_value = "warn"
needless_for_each = "warn"
single_match_else = "warn"
