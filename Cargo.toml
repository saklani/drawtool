[package]
name = "drawtool"
version = "0.6.0"
edition = "2021"
description = "Render Mermaid-style flowcharts as box diagrams in the terminal"
license = "MIT"

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
terminal_size = "0.4"
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
# Layout arithmetic should never overflow; if it does, fail loudly instead of
# wrapping into a huge coordinate and hanging.
overflow-checks = true
lto = true
strip = true

[dev-dependencies]
unicode-width = "0.2"
